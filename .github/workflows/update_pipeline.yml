name: Update Pipeline
on: 
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 5"
permissions: 
  contents: write
jobs:
  update_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Execute update pipeline
        run: uv run python -m pipeline.flows

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"

          git add data/f1_market.duckdb

          git diff --staged --quiet || git commit -m "Update F1 data"

          git push